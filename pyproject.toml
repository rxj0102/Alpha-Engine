[project]
name = "alpha-engine"
version = "0.1.0"
description = "Does a machine learning forecast add anything to momentum and carry in multi-asset allocation?"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "cvxpy>=1.4",
    "matplotlib>=3.7",
    "pytest>=7.4"
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
