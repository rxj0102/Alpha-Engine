[project]
name = "alpha-engine"
version = "0.1.0"
description = "Research code for Alpha-Engine"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.36",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "arch>=6.3",
    "cvxpy>=1.4",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pytest>=7.4"
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
